name: push_pypi

# Releases are gated on the version CHANGING, not merely on the tests passing.
#
# The trigger is still a successful "pytest" run on main, so a release is still
# "bump the version and push".  What changed is that every OTHER push to main --
# a docstring fix, a new dataset, a refactor -- no longer attempts an upload.
# Previously any green run tried to publish, and because PyPI refuses a
# duplicate version and this workflow set no "skip-existing", the attempt failed
# the run rather than skipping it.  A red CI badge for a commit that was never
# meant to be a release.
#
# The checkout is also pinned to the commit that was TESTED.  A workflow_run job
# checks out the default branch by default, not the revision that triggered it,
# so without head_sha a fast follow-up push could publish a commit that the
# passing test run never saw.

on:
  workflow_run:
    workflows: ["pytest"]
    branches: [ main ]
    types:
      - completed


jobs:
  publish-pypi:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout the tested commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Is this version already on PyPI?
      id: version
      run: |
        set -euo pipefail
        V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "version=$V" >> "$GITHUB_OUTPUT"
        CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/jiku-data/$V/json")
        if [ "$CODE" = "200" ]; then
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "jiku-data $V is already on PyPI; nothing to release."
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "jiku-data $V is not on PyPI; releasing."
        fi

    - name: Install build dependencies
      if: steps.version.outputs.published == 'false'
      run: >-
        python3 -m
        pip install
        build
        --user

    - name: Build
      if: steps.version.outputs.published == 'false'
      run: python -m build

    - name: Publish to pypi
      if: steps.version.outputs.published == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
