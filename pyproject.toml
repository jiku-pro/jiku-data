
[project]
name            = "jiku-data"
version         = "0.1.10"
description     = "'Open source datasets, component of Jiku Core"
readme          = "README.md"
requires-python = ">=3.9"


keywords        = [
    "datasets",
    "data analysis",
    "functional data analysis",
    "time series analysis",
]

authors         = [
    {name = "Jiku Pro", email = "admin@jiku.pro" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.9",
]


dependencies = [
  "numpy",
  "tables",
]



[project.urls]  # Optional
"Homepage"    = "https://github.com/jiku-pro/jiku-data"
"Source"      = "https://github.com/jiku-pro/jiku-data"
"Bug Reports" = "https://github.com/jiku-pro/jiku-data/issues"




[build-system]
requires      = ["setuptools>=64", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where      = ["src"]
namespaces = true

# Dataset payloads.  These MUST be declared explicitly: without them the wheel
# contains only .py files unless setuptools-scm happens to be installed AND the
# build runs inside a git checkout.
[tool.setuptools.package-data]
"*" = [
    "*.csv",          # datasets/<Name>/data.csv
    "*.npz",          # datasets/<Name>/expected_results.npz
    "*.md",           # datasets/<Name>/README.md
    "data_x/*.csv",   # datasets/SpeedPP2D[S]/data_x/
    "data_y/*.h5",    # datasets/SpeedPP2D[S]/data_y/
]
